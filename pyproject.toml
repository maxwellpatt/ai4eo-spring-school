[project]
name = "ai4eo-spring-school"
version = "0.1.0"
description = "AI4EO Spring School 2026 — OBELIX / IRISA, Université Bretagne Sud, Vannes, April 8–10 2026"
requires-python = ">=3.12"
dependencies = [
    # Deep learning
    "torch>=2.3",
    "torchvision>=0.18",
    "torchgeo>=0.6",
    # Geospatial
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "fiona>=1.9",
    # STAC / data access
    "pystac>=1.10",
    "pystac-client>=0.8",
    "stackstac>=0.5",
    "planetary-computer>=1.0",
    # Array / xarray stack
    "numpy>=1.26",
    "xarray>=2024.1",
    "zarr>=2.17",
    "dask[array]>=2024.1",
    # Point clouds (open3d excluded: no cp313 wheels yet)
    "laspy>=2.5",
    # Visualisation & notebooks
    "matplotlib>=3.8",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    # ML utilities
    "scikit-learn>=1.4",
    "einops>=0.7",
    "timm>=1.0",
]

[project.optional-dependencies]
dagster = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
    "pytest>=8.0",
    "ipykernel>=6.29",
]

[tool.dagster]
module_name = "definitions"

[tool.ruff]
line-length = 100
target-version = "py313"
