name: Dagster CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: validate — every PR, ~30s                                    #
  # Checks all assets, jobs, and configs resolve without errors.        #
  # ------------------------------------------------------------------ #
  validate:
    name: Validate definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dagster

      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -f definitions.py

  # ------------------------------------------------------------------ #
  # Job 2: materialize-data — every PR                                  #
  # Materializes raw_data + geo_dataset (download + dataset probe).     #
  # Fast; no GPU required.                                              #
  # ------------------------------------------------------------------ #
  materialize-data:
    name: Materialize data assets
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dagster

      - name: Materialize raw_data and geo_dataset
        run: |
          uv run dagster asset materialize \
            -f definitions.py \
            --select "raw_data geo_dataset"

  # ------------------------------------------------------------------ #
  # Job 3: materialize-full — main branch pushes only                   #
  # Full pipeline including training. Too slow for every PR.            #
  # ------------------------------------------------------------------ #
  materialize-full:
    name: Materialize full pipeline
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dagster

      - name: Materialize full torchgeo_tutorial group
        run: |
          uv run dagster asset materialize \
            -f definitions.py \
            --select "torchgeo_tutorial/*"
